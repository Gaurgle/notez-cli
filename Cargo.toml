[package]
name = "notez"
version = "0.1.0"
edition = "2021"
description = "A CLI note-taking tool with numbered directories and quick capture"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = "0.11"
console = "0.15"
chrono = "0.4"
dirs = "6"
rustyline = "15"

[dev-dependencies]
tempfile = "3"
